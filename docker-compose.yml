version: '3.8'

services:
  catalog-api:
    build: ./source/catalog-api
    image: catalog-api:v1
    container_name: catalog-api
    ports:
      - "8001:8000"
    restart: always

  orders-api:
    build: ./source/orders-api
    image: orders-api:v1
    container_name: orders-api
    ports:
      - "8002:8000"
    restart: always

  customers-api:
    build: ./source/customers-api
    image: customers-api:v1
    container_name: customers-api
    ports:
      - "8003:8000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/server.crt:/etc/nginx/certs/server.crt:ro
      - ./deploy/nginx/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - catalog-api
      - orders-api
      - customers-api
    restart: always
